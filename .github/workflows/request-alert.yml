name: Account request alert

# Every hour, check whether anyone is waiting for account approval.
# If so, open a GitHub issue that @mentions the repo owner (GitHub emails you about it).
# When the queue is empty again, the issue closes itself. One email per batch, not per hour.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: request-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      LABEL: account-requests
    steps:
      - name: Count waiting requests
        id: count
        run: |
          status=$(curl -sS -o count.json -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/pending_request_count" || echo 000)
          if [ "$status" = "404" ]; then
            echo "::warning::pending_request_count() not found. Run supabase/migrations/002_editor_tools.sql in Supabase."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Supabase answered HTTP $status"; cat count.json; exit 1
          fi
          count=$(tr -dc '0-9' < count.json)
          echo "Waiting requests: ${count:-0}"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the alert issue
        if: steps.count.outputs.skip != 'true'
        env:
          COUNT: ${{ steps.count.outputs.count }}
        run: |
          site="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/${GH_REPO#*/}/#/admin"
          gh label create "$LABEL" --color FF66C4 --description "Account requests waiting for approval" 2>/dev/null || true
          open_issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "${COUNT:-0}" -gt 0 ]; then
            noun=$([ "$COUNT" -eq 1 ] && echo "request is" || echo "requests are")
            body="@${OWNER} ${COUNT} account ${noun} waiting for approval on the Phantasia Community Calendar.

          Review them here: ${site}

          _This issue closes itself once no requests are waiting._"
            if [ -z "$open_issue" ]; then
              gh issue create --title "Account requests waiting ($COUNT)" --label "$LABEL" --body "$body"
            else
              gh issue edit "$open_issue" --title "Account requests waiting ($COUNT)" --body "$body"
            fi
          elif [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "All account requests have been handled."
          else
            echo "Nothing waiting."
          fi
