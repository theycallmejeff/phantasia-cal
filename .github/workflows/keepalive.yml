name: Keep Supabase awake

# Supabase pauses free projects after 7 days without database activity.
# This reads one event twice a week so the calendar never goes to sleep.
# It uses the same repository secrets as the deploy workflow.

on:
  schedule:
    # Mondays and Thursdays at 9:17 AM Central (14:17 UTC); never more than 4 days apart
    - cron: '17 14 * * 1,4'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one event from Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repository secret is missing."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/events?select=id&limit=1"
          # Retry a few times in case Supabase is briefly slow to answer
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' \
              -H "apikey: $SUPABASE_KEY" "$url" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Supabase answered (HTTP 200) on attempt $attempt. The database is awake."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 20
          done
          echo "::error::Supabase did not answer (last status $status). Check the project in the Supabase dashboard; it may already be paused."
          head -c 500 response.json || true
          exit 1
