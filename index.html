<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantasia Community Calendar</title>
    <meta name="description" content="Community events from the Krewe of Phantasia in New Orleans. See what's happening, save events to your calendar, or subscribe." />
    <meta name="theme-color" content="#ff66c4" />
    <!-- Link previews (iMessage, Facebook, Slack, etc.). VITE_SITE_URL is set by the deploy workflow. -->

    <meta property="og:site_name" content="Phantasia Community Calendar" />
    <meta property="og:title" content="Phantasia Community Calendar" />
    <meta property="og:description" content="Community events from the Krewe of Phantasia in New Orleans." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" type="text/calendar" title="Phantasia Community Calendar" href="calendar.ics" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Inter:wght@400;500;600&display=swap"

    />
